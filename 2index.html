<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Cañón</title>
  <style>
    body {
      margin: 0;
      background: #111;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;


    let y = 648
    let x = 52
    const gravedad = 0.2;
    let velocidady = -8
    let velocidadx = 4
   



    // ctx.beginPath();
    // ctx.arc(x,y, 50, 0, 2 * Math.PI);
    // ctx.fillStyle = "blue";
    // ctx.fill();

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // ↓↓↓ TU CÓDIGO ACÁ ↓↓↓
      // Dibuja un círculo azul en x=100, y=200, radio 20
      ctx.beginPath();
      ctx.arc(x, y, 50, 0, 2 * Math.PI);
      ctx.fillStyle = "blue";
      ctx.fill();
      velocidady += gravedad
      x += velocidadx
      y += velocidady

      requestAnimationFrame(draw);
      // ↑↑↑ TU CÓDIGO ACÁ ↑↑↑
    }

     draw();
  </script>
</body>

</html>
